title: KH2 Combat for KH1 (testing-merge branch)
originalAuthor: PM (kh2-combat)
description: >-
  Kingdom Hearts II's combat and movement for Sora in Kingdom Hearts Final Mix, run by KH1's own
  engine: KH2's combos, finishers and combo abilities, Quick Run, Aerial Dodge, Glide, Dodge Roll,
  Guard and Counterguard, KH2's hit reactions, KH2's field camera, a fourth shortcut, Reflect and
  the Drive Forms. KH2's animations, sounds and effects are read from your own KH2 install. For the
  Steam and Epic Games Store releases of KH 1.5+2.5. Choose KH1 or KH2 for each setting in the game's Config menu;
  every setting is also in kh1-kh2.ini in the game folder (made on first launch). Testing-merge
  branch: not checked in game yet.
assets:
- name: dll/kh1-kh2.dll
  method: copy
  source:
  - name: kh1-kh2.dll
