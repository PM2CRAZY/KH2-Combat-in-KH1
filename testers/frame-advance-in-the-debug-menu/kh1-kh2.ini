; kh1-kh2 settings (read when the game starts, and again whenever this file is saved)
;
; abilities: kh1 = KH2's abilities from KH1's Ability menu, Sora's level and bosses (normal
; play); remove = take the KH2 abilities back out of your save (load it, save once, then
; uninstall); test = every KH2 movement ability at MAX; all = everything, every modifier
abilities = kh1
; hurt: kh2 = Sora takes hits KH2's way (dodge-roll invulnerability, KH2 guard, KH2
; reactions); kh1 = KH1's own hit reactions
hurt = kh2
; carry: on = moving platforms carry Sora and KH1's pushes move him while KH2 has him
carry = on
; ceilings: on = ceilings stop KH2's jumps (KH1's collision), off = they don't
ceilings = on
; grabs: on = KH1's ledge grabs, vine / rope grabs and swimming take Sora from KH2's jumps
grabs = on
; commands: on = KH1's commands other than Attack (magic, items, specials, summons) take
; Sora from KH2 until KH1 has him standing again (in the air: KH1's fall from there)
commands = on
; swing_fx: on = KH2's swings play KH1's Keyblade trail, swing effect and Sora's voice
swing_fx = on
; hit_fx_test: (test) KH2 hits write these values, in turn, into one byte of KH1's hit
;   effect bytes (hit_fx_byte: 0, 1 or 2), spells too; empty = off. E.g. 0,1,2,3,5,10
hit_fx_test =
hit_fx_byte = 0
; hit_effect_test: (test) each landed KH2 hit starts the next of these KH1 effect ids (Sora's
;   effects, 0x1402ABB60) on the foe hit (hit_effect_on = target) or on Sora (= sora);
;   ranges allowed, e.g. 0-20,30; empty = off
hit_effect_test =
hit_effect_on = target
; kh2_sounds: KH2's own sound effects for these moves, from your KH2 install:
; abilities (every KH2 ability move: Upper Slash, Explosion, Aerial Finish...), all (every
; move, the plain combo too), off
kh2_sounds = abilities
kh2_volume = 1.0
; damage_scale: times the damage of Sora's KH2 attacks (1.0 = KH1's hit x KH2's power)
damage_scale = 1.0
; magic_scale: times KH2's Magic-based attacks on top (Explosion, Magnet Burst; they also
;   grow with Sora's max MP, +10% a point)
magic_scale = 1.0
; glide: square = Square in the air glides (as KH1's Superglide); jump = hold jump in the air
glide = square
; air_cast_fall: how fast Sora falls while Reflect plays in the air, a share of KH1's own
;   gravity (0 = he hangs, 1 = KH1's); his fall is stopped as the cast starts (physics = kh1,
;   and Valor / Wisdom; with physics = kh2 base Sora's air casts are KH2's own)
air_cast_fall = 1.0
; kh2_voice: on = Sora's KH2 battle voice on those moves instead of KH1's; off = KH1's voice
; (battle_quotes, below, takes its place once set)
kh2_voice = off
; bonus_ap: on = (abilities = kh1) Sora's max AP grows by the AP of each KH2 ability he learns
bonus_ap = on
; auto_aim: off = swings turn toward only KH1's target (the R1 lock or the small cursor);
; on = KH2's own pick, the nearest enemy in reach
auto_aim = off
; wall_clink: on = a swing that meets a wall clinks off it and bounces Sora back; off = it passes
wall_clink = on
; camera: kh2 = KH2's field camera (follows behind, right stick turns and zooms, R3 resets);
; kh1 = KH1's own. The Config menu's camera row switches it in game too.
camera = kh1
; camera_scale: KH2's camera distances and heights times this; 0.89 = KH1 Sora's size against
; KH2 Sora's (hips 78.9 / 88.5), so he is framed exactly as in KH2
camera_scale = 0.89
; shared: on = KH1's own states run base Sora (idle, walk, run, jump, fall, landing), with
;   KH2's animations where a move style is KH2 (and KH2's physics with physics = kh2); KH2
;   borrows him only for its own moves; off = KH2's controller has him whenever he stands,
;   walks or runs (older builds)
shared = on
; kh1_slots: on = KH2's moves that have one play as new slots in KH1's own motion table (KH1's
;   clock, events, hit windows and blends; for now KH2's ground combo, 151 / 152 / 154, and air combo 183 / 184 / 181, at Base
;   / Aerial Base Combo KH2); a list of KH2 motions (e.g. 152) = only those; off = KH2's motions drawn over
;   KH1's (as before)
kh1_slots = on
; kh1_bake: on = those slots are KH2's motions baked into KH1 motions at load (KH1's own pass
;   shows them, nothing drawn over it; KH1's FK, so no foot lift on slopes in them yet); off = the
;   slot is a retimed KH1 motion with KH2's drawn over it
kh1_bake = on
; camera_lower: KH2's camera (look point and eye together) this much lower (0 = as KH2)
camera_lower = 0
; camera_calls: kh2 = (camera = kh2) KH2's camera runs as KH1's own camera mode: KH1's moves,
;   its ledge / climbing / pole cameras, its lock-on switches and its door walks keep KH2's
;   camera and field of view (events and cutscenes stay KH1's); kh1 = they hand the view to
;   KH1's camera (older builds)
camera_calls = kh2
; config_row: on = the Config menu's Camera Style row; off = no row (the ini alone switches)
config_row = on
; shortcuts: 4 = KH2's four shortcuts (L1 + the cancel button is the fourth; set it in
; Customize); 3 = KH1's three
shortcuts = 4
; kh2_effects: KH2's own visual effects for these moves, from your KH2 install, drawn in
; KH1's frame: magnet_explosion (Magnet Burst, Explosion, Vicinity Break, Aerial Finish, Guard
;   Break, Finishing Leap, Aerial Recovery), all (every move), off
kh2_effects = magnet_explosion
; kh2_fx_native: on = the KH2 effects ported so far play through KH1's own effect system
;   (Explosion's wrist flashes); off = all drawn by the KH2 effect player as before
kh2_fx_native = on
; flip_weapons: Sora's weapons (KH1 item ids) KH2's grip holds the wrong way round, turned half
; round in his hand (0x53: the Dream Shield); none = off
flip_weapons = 0x53
; reflect: on = KH2's Reflect in the Magic menu and the shortcuts once Sora has Aero (KH2's
; cast, barrier, counter, effects and sounds, from your KH2 install; Reflera / Reflega with
; Aerora / Aeroga; 1 MP); off = KH1's spells only
reflect = on
; keyblade_turn: on = every Keyblade held with its teeth up, as KH2 holds it (KH1's grip held
; them to the ground under KH2's moves); off = as before
keyblade_turn = on
; hair_physics: on = Sora's hair, hood and keychain move during KH2's moves; off = rigid
hair_physics = on
; kh2_hair: on = (hair_physics = on) they move as KH2 animates its own hair, hood and keychain in
; each move; off = the older swing and sway (a breeze and gravity) instead
kh2_hair = on
; drive: on = D-pad left at the battle menu's top flips to a second page (Attack, Magic, Items,
; Drive), Drive listing KH2's forms; off = KH1's menu only
drive = on
; valor_left_blade: on = in Valor Form, its Keyblade in Sora's left hand (KH1's own model of it);
; off = nothing of it is installed (turn it off if it misbehaves)
valor_left_blade = on
; physics: kh1 or kh2, whose physics move base Sora in every move (run speeds, jump arc,
;   gravity, air drift, attack travel), whatever the move styles below (they choose the
;   animations); Drive Forms always KH2's. The Config menu's Physics row switches it in game
physics = kh1
; ground_combo / air_combo / magic / air_magic: kh1 or kh2, which game's moves base Sora uses
; for each (Drive Forms keep their own); the Config menu switches them in game too
ground_combo = kh2
air_combo = kh2
magic = kh1
air_magic = kh1
; jump_style / glide_style: kh1 or kh2, KH1's or KH2's jump and glide for base Sora
jump_style = kh1
glide_style = kh1
; roll_style: kh1 or kh2, KH1's or KH2's dodge roll for base Sora
roll_style = kh1
; misc_anims: kh1 or kh2, KH1's or KH2's animations for base Sora standing, walking, running
; and using an item (KH2 still moves him; KH1 runs the item either way)
misc_anims = kh2
; player_model: kh1 or kh2, draw Sora with KH1's model or KH2's (his KH2 Drive Form models and
; KH2's Keyblades where KH2 has the same one)
player_model = kh1
; battle_quotes: kh1 or kh2, Sora's KH1 or KH2 battle quotes (the Config menu's row; without
; this line kh2_voice decides)
battle_quotes = kh1
; gummi: vanilla = fly the Gummi Ship between worlds; skip = land in the chosen world at once
; (the Config menu's Gummi Routes row switches it in game too)
gummi = vanilla
; trace: on = the last trace_seconds of Sora's frames (position, KH1's and KH2's states, the pad)
; are kept and written to the kh1-kh2-traces folder on Select + Triangle, or on their own when
; something looks wrong; always = every frame is also written to kh1-kh2.trace.csv; off = none
trace = on
; trace_seconds: how many seconds before the dump the trace clip holds (1 to 120, default 10)
trace_seconds = 6
; sound_log: on = every KH1 menu sound, voice group and voice clip played is a line in the log
; (the id and where it was called from, docs/kh1-sounds.md); off = none (the debug menu switches it)
sound_log = off
; trace_*: what each trace row holds (on / off each; the debug menu's Trace Recorder page switches
; them): movement (position, floor, collision, velocity), kh1_state, kh2_state, form, draw
; (animation draw), feet (feet / IK), kh1_camera, kh2_camera, input, config, log (log lines),
; hit_fx (hit effect lines), sounds (sound log lines)
trace_movement = on
trace_kh1_state = on
trace_kh2_state = off
trace_form = off
trace_draw = on
trace_feet = on
trace_kh1_camera = on
trace_kh2_camera = on
trace_input = on
trace_config = on
trace_log = on
trace_hit_fx = off
trace_sounds = off
; debug_menu: on = L1 + R1 + Triangle opens the debug menu (the Config menu's Debug Menu row
; switches it in game too); off = the buttons do nothing
debug_menu = on
trace_game_frames = on
