# Starts the owner's "Auto tester update on PC (BoogleChan)" Claude task within about a minute of
# BoogleChan pushing a change to the tester threads on the testing branch, instead of waiting for
# its hourly check. The task itself re-checks who pushed (tools/testers/autoupdate.py) before it
# does anything, so this workflow only decides when to wake it.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   ROUTINE_FIRE_URL    the task's API trigger URL (.../v1/claude_code/routines/trig_.../fire)
#   ROUTINE_FIRE_TOKEN  the token generated for that API trigger
name: Tester auto-update

on:
  push:
    branches: [testing]
    paths:
      - "testers/**"
      - "docs/tester-requests.md"

permissions: {}

# A burst of pushes (several files, quick fixes) collapses into one wake-up.
concurrency:
  group: tester-autoupdate
  cancel-in-progress: true

jobs:
  wake:
    # github.actor is the account that made the push; the id check guards against a renamed account
    if: github.actor == 'BoogleChan' && github.event.sender.id == 345641864
    runs-on: ubuntu-latest
    steps:
      - name: Wait for follow-up pushes
        run: sleep 60
      - name: Start the update task
        env:
          URL: ${{ secrets.ROUTINE_FIRE_URL }}
          TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
        run: |
          if [ -z "$URL" ] || [ -z "$TOKEN" ]; then
            echo "ROUTINE_FIRE_URL / ROUTINE_FIRE_TOKEN secrets are not set"; exit 1
          fi
          code=$(curl -sS -o resp.json -w '%{http_code}' -X POST "$URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"Woken by BoogleChan's push ${GITHUB_SHA::7} to testing.\"}")
          echo "HTTP $code"; grep -o '"claude_code_session_url":"[^"]*"' resp.json || cat resp.json
          [ "$code" -lt 300 ]
