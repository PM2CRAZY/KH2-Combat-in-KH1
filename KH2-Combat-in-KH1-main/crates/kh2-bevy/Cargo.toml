[package]
name = "kh2-bevy"
description = "Bevy playground: KH2FM movement and combat on a primitive mannequin posed by Sora's skeleton and motions, all read from the user's install."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"

[[bin]]
name = "kh2-playground"
path = "src/main.rs"

[dependencies]
character-core = { path = "../character-core" }
combat-core.workspace = true
kh2-data.workspace = true
kh2-formats.workspace = true
kh2-anim.workspace = true
kh2-rig.workspace = true
kh2-magic.workspace = true
map-collision.workspace = true
kh2-camera.workspace = true
bevy = { version = "=0.15.3", default-features = false, features = [
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_pbr",
    "bevy_render",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "png",
    "tonemapping_luts",
    "ktx2",
    "zstd",
    "x11",
] }

# Gamepad support. On Linux it needs libudev-dev; enable it there with
# `--features gamepad`.
[target.'cfg(not(target_os = "linux"))'.dependencies]
bevy = { version = "=0.15.3", default-features = false, features = ["bevy_gilrs"] }

[features]
gamepad = ["bevy/bevy_gilrs"]
